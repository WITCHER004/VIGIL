# Optional high-frequency probing for Vercel Hobby (whose built-in cron is daily only).
# Set repository secrets VIGIL_URL (e.g. https://vigil.example.vercel.app) and CRON_SECRET.
# Without them this workflow exits immediately and does nothing.
name: Probe monitors

on:
  schedule:
    - cron: "*/5 * * * *" # GitHub may delay scheduled runs by a few minutes under load
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/cron/probe
        env:
          VIGIL_URL: ${{ secrets.VIGIL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$VIGIL_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "VIGIL_URL / CRON_SECRET not configured — skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${VIGIL_URL%/}/api/cron/probe"
